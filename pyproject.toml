[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitcontext"
version = "1.0.0"
description = "GitContext: End-to-End Codebase Intelligence & Developer Copilot"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Haswanth Obbina"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "gitpython>=3.1.40",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[project.scripts]
gitcontext = "rag_project.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
